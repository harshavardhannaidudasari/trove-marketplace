services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trove
      POSTGRES_PASSWORD: trove
      POSTGRES_DB: trove
    ports:
      - "5432:5432"
    volumes:
      - trove_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trove -d trove"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://trove:trove@db:5432/trove
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      JWT_SECRET: dev-only-secret-change-in-production-abc123xyz
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8081"
      SEED_ON_START: "true"
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  trove_pgdata:
